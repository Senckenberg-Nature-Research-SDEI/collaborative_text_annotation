models:
  - name: ocr_model
    provider: openai
    model: gpt-4.1
    api_key: ${OPENAI_API_KEY}
    temperature: 0.3
    max_tokens: 4096
    model_card:
    tokenizer_card:
    top_p: 0.9
    model_kwargs:
      response_format: "json_object"


  - name: llm_model
    provider: openai
    model: gpt-4.1-mini
    api_key: ${OPENAI_API_KEY}
    temperature: 0.7
