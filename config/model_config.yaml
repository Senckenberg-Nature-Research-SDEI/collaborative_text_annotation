models:
  - name: ocr_model
    provider: openai
    model: gpt-4.1
    temperature: 0.3
    max_tokens: 4096
    model_card:
    tokenizer_card:
    top_p: 0.9
    model_kwargs:
      response_format: "json_object"


  - name: llm_model
    provider: openai
    model: gpt-4.1-mini
    temperature: 0.7
    max_tokens: 2048
    model_card:
    tokenizer_card:
    top_p: 0.9
    model_kwargs:
      response_format: "json_object"

default_model: primary